<svg viewBox="10 10 24 24" overflow="visible" fill="none" xmlns="http://www.w3.org/2000/svg">
<style>
@keyframes seeking-dot2-slide {
  0%, 19.96% {
    animation-timing-function: cubic-bezier(0.5, 1.7, 0.3, 1);
    transform: translateX(20px);
  }
  49.96%, 100% {
    transform: translateX(0);
  }
}
@keyframes seeking-dot2-fade {
  0%, 19.96% {
    animation-timing-function: cubic-bezier(0.5, 0, 0.5, 1);
    opacity: 0;
  }
  23.96%, 100% {
    opacity: 1;
  }
}
@keyframes seeking-dot3-slide {
  0%, 40% {
    animation-timing-function: cubic-bezier(0.431, 1.423, 0.323, 0.931);
    transform: translateX(20px);
  }
  70%, 100% {
    transform: translateX(0);
  }
}
@keyframes seeking-dot3-fade {
  0%, 40% {
    animation-timing-function: cubic-bezier(0.5, 0, 0.5, 1);
    opacity: 0;
  }
  44%, 100% {
    opacity: 1;
  }
}
@keyframes seeking-line-draw {
  0% {
    animation-timing-function: ease-out;
    stroke-dasharray: 0 1;
  }
  70%, 100% {
    stroke-dasharray: 1 1;
  }
}
.seeking-dot2 {
  animation:
    seeking-dot2-slide 2s linear infinite,
    seeking-dot2-fade 2s linear infinite;
}
.seeking-dot3 {
  animation:
    seeking-dot3-slide 2s linear infinite,
    seeking-dot3-fade 2s linear infinite;
}
.seeking-line {
  animation: seeking-line-draw 2s linear infinite;
}
</style>
<g clip-path="url(#seeking-frame)">
<circle cx="12" cy="22" r="3" fill="currentColor"/>
<circle class="seeking-dot2" cx="22" cy="22" r="3" fill="currentColor"/>
<circle class="seeking-dot3" cx="33" cy="22" r="3" fill="currentColor"/>
<path class="seeking-line" d="M10 22H34" pathLength="1" stroke="currentColor" stroke-width="2"/>
</g>
<defs>
<clipPath id="seeking-frame">
<rect width="44" height="44"/>
</clipPath>
</defs>
</svg>
