[package]
name = "mailbox-server"
version = "0.1.0"
edition = "2021"

[lib]
path = "src/lib.rs"

[[bin]]
name = "mailbox-server"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", features = ["json"] }
futures = "0.3"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
p2panda-net = { workspace = true }
redb = "3.1"
thiserror = "1.0"
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.22"
uuid = { version = "1.0", features = ["v7", "serde"] }
clap = { version = "4.5", features = ["derive"] }
push-notifications-client = { path = "../push-notifications-client" }
dashchat-utils = { workspace = true }
async-trait = "0.1"
anyhow = "1"
iroh = { version = "1.0.0", default-features = false, features = ["tls-ring"] }
iroh-blobs = "0.103.0"

[features]
test_utils = ["dep:axum-test", "dep:tempfile"]

[dependencies.axum-test]
version = "18"
optional = true

[dependencies.tempfile]
version = "3.14"
optional = true

[dev-dependencies]
mailbox-server = { path = ".", features = ["test_utils"] }
iroh = { workspace = true }
tempfile = "3.14"
push-notifications-client = { path = "../push-notifications-client" }
push-notifications-server = { path = "../push-notifications-server", features = ["test-utils"] }
futures = "0.3"
serial_test = "3"
base64 = "0.22"
reqwest = { version = "0.12", features = ["json"] }
