[package]
name = "mailbox-client"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
async-trait = "0.1.85"
blake3 = { version = "1.8.3", features = ["serde"] }
bytes = { version = "1.11.0", features = ["serde"] }
derive_more = { version = "1.0.0", features = ["full"] }
hex = "0.4.3"
nanoid = "0.4.0"
once_cell = "1.20.0"
reqwest = { version = "0.13", features = ["json"] }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1.43.0", features = ["full"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }

named-id = { git = "https://github.com/maackle/named-id.git", optional = true }
proptest = { version = "1.10.0", optional = true }

mailbox-api = { path = "../mailbox-api" }

# NOTE: only used for cbor encoding/decoding
p2panda-core = { git = "https://github.com/maackle/p2panda.git", branch = "dashchat" }

[dev-dependencies]
pretty_assertions = "1.4.1"
tokio = { version = "1.43.0", features = ["test-util"] }


[features]
default = ["proptest"]
proptest = ["dep:proptest"]
named-id = ["dep:named-id"]
