[package]
name = "mailbox-client"
version = "0.1.0"
edition = "2024"

[dependencies]
aliased = { workspace = true }
anyhow = "1"
async-trait = "0.1.85"
chrono = { version = "0.4.42", features = ["serde"] }
ciborium = "0.2.2"
derive_more = { version = "1.0.0", features = ["full"] }
once_cell = "1.20.0"
hex = "0.4.3"
nanoid = "0"
reqwest = { version = "0.12", features = ["json"] }
serde = { workspace = true }
serde_json = { workspace = true }
sqlx = { version = "0.8.6", features = ["runtime-tokio", "sqlite"] }
tokio = { version = "1.43.0", features = ["full"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }
bytes = "1.11.0"



# TODO: pull out the toy mailbox request/response types so they can be
#       independently depended upon
mailbox-server = { path = "../mailbox-server" }

# NOTE: only used for cbor encoding/decoding
p2panda-core = { workspace = true }
iroh = { version = "1.0.0", default-features = false, features = ["tls-ring"] }
iroh-blobs = "0.103.0"

[dev-dependencies]
pretty_assertions = "1.4.1"
tempfile = "3.24"
tokio = { version = "1.43.0", features = ["test-util"] }

