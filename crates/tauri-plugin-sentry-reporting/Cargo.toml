[package]
name = "tauri-plugin-sentry-reporting"
version = "0.1.0"
edition = "2021"
links = "tauri-plugin-sentry-reporting"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }

[dependencies]
tauri = { version = "2", default-features = false }
tauri-plugin-log = "2"
sentry = { version = "0.49", default-features = false, features = [
  "backtrace",
  "contexts",
  "panic",
  "debug-images",
  "log",
  "logs",
  "reqwest",
  "rustls-no-provider",
] }
reqwest = { version = "0.13", default-features = false, features = [
  "rustls-no-provider",
] }
rustls = { version = "0.23", default-features = false, features = [
  "ring",
  "std",
] }
webpki-roots = "1"
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
regex = "1"
log = "0.4"
dashchat-utils = { path = "../dashchat-utils", default-features = false }
tokio = { version = "1", features = ["time", "sync", "rt", "macros"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt", "test-util", "time"] }
