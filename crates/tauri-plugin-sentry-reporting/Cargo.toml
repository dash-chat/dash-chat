[package]
name = "tauri-plugin-sentry-reporting"
version = "0.1.0"
edition = "2021"
links = "tauri-plugin-sentry-reporting"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }

[dependencies]
tauri = { version = "2", default-features = false }
tauri-plugin-log = "2"
sentry = { version = "0.49", default-features = false, features = [
  "backtrace",
  "contexts",
  "panic",
  "debug-images",
  "log",
  "logs",
  "reqwest",
  "rustls-no-provider",
] }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
regex = "1"
log = "0.4"

[dev-dependencies]
tempfile = "3"
