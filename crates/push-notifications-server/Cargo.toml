[package]
name = "push-notifications-server"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "push-notifications-server"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
async-trait = "0.1.89"
axum = { version = "0.8", features = ["json"] }
chrono = { version = "0.4", features = ["serde"] }
derive_more = { version = "2.1.1", features = ["full"] }
push-notifications-client = { path = "../push-notifications-client" }
fcm_v1 = "0.3"
futures = "0.3"
gcp_auth = "0.12"
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

mockall = { version = "0.13", optional = true }
sqlx = { version = "0.8", features = ["runtime-tokio", "any", "sqlite"] }

[dev-dependencies]
anyhow = "1"
axum-test = "18"
hex = "0.4"
mockall = "0.13"
pretty_assertions = "1.4.1"
push-notifications-client = { path = "../push-notifications-client" }
push-notifications-server = { path = ".", features = ["test-utils"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "any", "sqlite"] }

[features]
test-utils = ["dep:mockall"]
