[package]
name = "mailbox-api"
version = "0.1.0"
edition = "2024"

[dependencies]
base64 = "0.22.0"
blake3 = { version = "1.8.3", features = ["serde"] }
bytes = { version = "1.11.0", features = ["serde"] }
derive_more = { version = "1.0.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

proptest = { version = "1.4.0", optional = true }
