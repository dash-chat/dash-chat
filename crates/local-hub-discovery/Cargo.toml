[package]
name = "local-hub-discovery"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
log = "0.4"
base64 = "0.22"
data-encoding = "2"
futures = "0.3"
swarm-discovery = "0.6.3"
if-addrs = "0.15"
network-watch = { workspace = true }
tokio = { version = "1", features = ["macros", "net", "rt", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
