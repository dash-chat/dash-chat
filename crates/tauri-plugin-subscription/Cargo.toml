[package]
name = "tauri-plugin-subscription"
version = "0.1.0"
edition = "2021"
links = "tauri-plugin-subscription"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }

[dependencies]
tauri = "2.9"
tokio = { version = "1", features = ["sync", "rt", "macros"] }
tokio-util = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
