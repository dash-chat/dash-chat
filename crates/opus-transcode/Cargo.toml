[package]
name = "opus-transcode"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = { workspace = true }
# Decode-only. Container/codec support per source: WAV (desktop), MP4/AAC
# (Android m4a), ADTS AAC (iOS). The `aac` codec crate provides the ADTS reader.
symphonia = { version = "0.5", default-features = false, features = [
  "wav",
  "pcm",
  "isomp4",
  "aac",
] }
opus = "0.3"
ogg = "0.9"

[dev-dependencies]
hound = "3.5"
