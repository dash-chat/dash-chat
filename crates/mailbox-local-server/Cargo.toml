[package]
name = "mailbox-local-server"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "mailbox-local-server"
path = "src/main.rs"

[dependencies]
mailbox-server = { workspace = true }
anyhow = "1"
tokio = { version = "1", features = ["full"] }
mdns-sd = "0.17"
clap = { version = "4.5", features = ["derive"] }
futures = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
