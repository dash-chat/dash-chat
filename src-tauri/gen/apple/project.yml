name: dash-chat
options:
  bundleIdPrefix: studio.darksoil.dashchat
  deploymentTarget:
    iOS: 14.0
fileGroups: [../../src]
configs:
  debug: debug
  release: release
settingGroups:
  app:
    base:
      PRODUCT_NAME: Dash Chat
      PRODUCT_BUNDLE_IDENTIFIER: studio.darksoil.dashchat
targetTemplates:
  app:
    type: application
    sources:
      - path: Sources
    scheme:
      environmentVariables:
        RUST_BACKTRACE: full
        RUST_LOG: info
    settings:
      groups: [app]
targets:
  dash-chat_iOS:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Assets.xcassets
      - path: Externals
      - path: dash-chat_iOS
      - path: assets
        buildPhase: resources
        type: folder
      - path: LaunchScreen.storyboard
    info:
      path: dash-chat_iOS/Info.plist
      properties:
        LSRequiresIPhoneOS: true
        UILaunchStoryboardName: LaunchScreen
        UIRequiredDeviceCapabilities: [arm64, metal]
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleShortVersionString: 0.10.1
        CFBundleVersion: "0.10.1"
        FirebaseAppDelegateProxyEnabled: false
        FirebaseMessagingAutoInitEnabled: false
        FirebaseDataCollectionDefaultEnabled: false
    entitlements:
      path: dash-chat_iOS/dash-chat_iOS.entitlements
    scheme:
      environmentVariables:
        RUST_BACKTRACE: full
        RUST_LOG: info
    settings:
      base:
        ENABLE_BITCODE: false
        ARCHS: [arm64]
        VALID_ARCHS: arm64 
        LIBRARY_SEARCH_PATHS[arch=x86_64]: $(inherited) $(PROJECT_DIR)/Externals/x86_64/$(CONFIGURATION) $(SDKROOT)/usr/lib/swift $(TOOLCHAIN_DIR)/usr/lib/swift/$(PLATFORM_NAME) $(TOOLCHAIN_DIR)/usr/lib/swift-5.0/$(PLATFORM_NAME)
        LIBRARY_SEARCH_PATHS[arch=arm64]: $(inherited) $(PROJECT_DIR)/Externals/arm64/$(CONFIGURATION) $(SDKROOT)/usr/lib/swift $(TOOLCHAIN_DIR)/usr/lib/swift/$(PLATFORM_NAME) $(TOOLCHAIN_DIR)/usr/lib/swift-5.0/$(PLATFORM_NAME)
        ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES: true
        EXCLUDED_ARCHS[sdk=iphoneos*]: x86_64
        OTHER_LDFLAGS: $(inherited) -force_load "$(DERIVED_FILE_DIR)/firebase-categories/libfb-categories.a"
      groups: [app]
    dependencies:
      - framework: libapp.a
        embed: false
      - sdk: CoreGraphics.framework
      - sdk: Metal.framework
      - sdk: MetalKit.framework
      - sdk: QuartzCore.framework
      - sdk: Security.framework
      - sdk: UIKit.framework
      - sdk: WebKit.framework
    preBuildScripts:
      - script: |
          # Xcode runs build phases with a sanitized PATH that excludes Homebrew
          # and Node version managers, so source .xcode.env (and the optional,
          # gitignored .xcode.env.local override) to put node/pnpm on PATH.
          [ -f "$SRCROOT/.xcode.env" ] && . "$SRCROOT/.xcode.env"
          [ -f "$SRCROOT/.xcode.env.local" ] && . "$SRCROOT/.xcode.env.local"
          pnpm tauri ios xcode-script -v --platform ${PLATFORM_DISPLAY_NAME:?} --sdk-root ${SDKROOT:?} --framework-search-paths "${FRAMEWORK_SEARCH_PATHS:?}" --header-search-paths "${HEADER_SEARCH_PATHS:?}" --gcc-preprocessor-definitions "${GCC_PREPROCESSOR_DEFINITIONS:-}" --configuration ${CONFIGURATION:?} ${FORCE_COLOR} ${ARCHS:?}
        name: Build Rust Code
        basedOnDependencyAnalysis: false
        outputFiles:
          - $(SRCROOT)/Externals/x86_64/${CONFIGURATION}/libapp.a
          - $(SRCROOT)/Externals/arm64/${CONFIGURATION}/libapp.a
      - script: |
          set -eu
          # Extract every ObjC category object file (Foo+Bar.m.o) out of
          # libapp.a into a sidecar archive that we -force_load from
          # OTHER_LDFLAGS. This defeats the linker's dead-code stripping of
          # category methods that Firebase dispatches dynamically via
          # objc_msgSend (e.g. +[NSError messagingErrorWithCode:...],
          # +[NSData gul_dataByGzippingData:...]).
          #
          # Why not -ObjC? Apple's newer linker (Xcode 15+) has been known to
          # strip categories from static libs even with -ObjC + -dead_strip.
          # Why not -force_load on libapp.a itself? libapp.a contains duplicate
          # copies of Tauri/SwiftRs objects (one per Swift plugin that imports
          # them), causing duplicate-symbol errors under force_load.
          LIBAPP="$SRCROOT/Externals/$ARCHS/$CONFIGURATION/libapp.a"
          OUTDIR="$DERIVED_FILE_DIR/firebase-categories"
          OUTLIB="$OUTDIR/libfb-categories.a"
          rm -rf "$OUTDIR"
          mkdir -p "$OUTDIR"
          cd "$OUTDIR"
          CATEGORY_OBJS=$(ar -t "$LIBAPP" 2>/dev/null | grep -E '\+.*\.m\.o$' | sort -u || true)
          if [ -n "$CATEGORY_OBJS" ]; then
            # shellcheck disable=SC2086
            ar -x "$LIBAPP" $CATEGORY_OBJS 2>/dev/null || true
          fi
          if ls *.o >/dev/null 2>&1; then
            ar -rcs "$OUTLIB" *.o
            echo "Generated $OUTLIB with $(ls *.o | wc -l | tr -d ' ') category objects"
          else
            # Placeholder so -force_load doesn't fail the link.
            printf 'static int _keep;\n' > keep.c
            xcrun clang -c -target "$ARCHS-apple-ios" keep.c -o keep.o
            ar -rcs "$OUTLIB" keep.o
            echo "Warning: no category objects found in $LIBAPP"
          fi
        name: Extract Firebase Categories
        basedOnDependencyAnalysis: false
        inputFiles:
          - $(SRCROOT)/Externals/$(ARCHS)/$(CONFIGURATION)/libapp.a
        outputFiles:
          - $(DERIVED_FILE_DIR)/firebase-categories/libfb-categories.a