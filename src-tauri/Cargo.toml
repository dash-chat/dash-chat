[package]
name = "dash-chat"
version = "0.21.2"
description = "Dash Chat"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.70"

[lib]
name = "tauri_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
tauri-build = { version = "2.7.3", default-features = false, features = [] }
vergen-gitcl = "9"
sentry-types = "0.42"

[dependencies]
tauri = { version = "2.12.4", features = ["devtools", "tray-icon", "image-png"] }

tauri-plugin-system-theme = { git = "https://github.com/dash-chat/tauri-plugin-system-theme", rev = "347505a15d1607529d1426fe126274a9082e27a9" }
tauri-plugin-dialog = "2.3"
tauri-plugin-process = "2.3"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-deep-link = "2"
tauri-plugin-clipboard-manager = "2"
# The #277 merge: its windows crates match Tauri 2.12, which no published
# version does, so the Windows build fails on 0.3.1. Later commits want
# compileSdk 37, which the nix Android SDK lacks.
tauri-plugin-sharekit = { git = "https://github.com/Choochmeque/tauri-plugin-sharekit", rev = "61a7b9f40e67f43740538123e74f9ebb4c260fab" }
tauri-plugin-fs = "2"
tauri-plugin-os = "2"
tauri-plugin-opener = "2"
tauri-plugin-log = { version = "2.0.0", features = ["tracing"] }
tauri-plugin-audio-recorder = "=0.1.2"
tauri-plugin-sentry-reporting = { workspace = true }
tauri-plugin-subscriptions = { git = "https://github.com/dash-chat/tauri-plugin-subscriptions", rev = "30d1a889a4d7fca0a28bc9d77a7662b6f95cec29" }

tauri-plugin-virtual-keyboard = { git = "https://github.com/dash-chat/tauri-plugin-virtual-keyboard", rev = "6163645a2c730338cadc0d9def0ff3091be0515b" }
tauri-plugin-notification = { git = "https://github.com/guillemcordoba/plugins-workspace", rev = "a415a74db8f09350abd7e1a733c2b0c30e4730be", features = [
  "push-notifications-fcm",
] }
dashchat-node = { path = "../crates/dashchat-node" }
mailboxes-manager = { workspace = true }
network-watch = { workspace = true }
# Discovery runs on every platform; only the hub server itself is desktop-only.
local-hub-discovery = { workspace = true }
push-notifications-client = { path = "../crates/push-notifications-client" }
dashchat-utils = { workspace = true }
sqlite-gate = { workspace = true }
panic-policy = { workspace = true }
opus-transcode = { workspace = true }

p2panda = { workspace = true }
iroh = { workspace = true }
p2panda-auth = { workspace = true }
p2panda-core = { workspace = true }

anyhow = "1.0.95"
async-trait = "0.1.85"
backon = { version = "1.6", default-features = false, features = ["std", "tokio-sleep"] }
time = "0.3"
tokio = { version = "1.43.0", features = ["fs"] }
tokio-util = { version = "0.7", features = ["rt"] }
tokio-stream = { version = "0.1.17", features = ["sync"] }
async-rx = "0.2"
async-stream = "0.3"
thiserror = "2.0"
regex = "1"
hex = "0.4.3"
nanoid = "0"
image = "0.25"

log = "0.4"
netdev = "0.43"
if-watch = { version = "3", features = ["tokio"] }
iana-time-zone = "0.1"
sysinfo = "0.38"
url2 = "0.0.6"
app_dirs2 = "2.5.5"
uuid = "1"
serde = "1"
serde_json = "1"
sqlx = { version = "0.9.0", features = ["sqlite", "runtime-tokio"] }
chrono = "0.4.42"
sonix-i18n = "0.1.1"
futures = "0.3"

# Work around "hyper-tls" not found issue in nix build tauri app
# TODO: remove this dependency
hyper-tls = "0.6"

# Logging
libc = "0.2"
env_logger = "0.11"

# Build openssl from source to cross-compile to each platform as needed
openssl-sys = { version = "0.9", features = ["vendored"] }

# `iroh-relay` (via `reqwest 0.13` + `rustls 0.23`) panics on first TLS
# handshake unless a CryptoProvider has been installed. Pull rustls in
# directly so we can install the `ring` provider at startup.
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }

[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-barcode-scanner = { git = "https://github.com/guillemcordoba/plugins-workspace", branch = "fix/barcode-scanner-ios" }
tauri-plugin-view = "0.0.5"
tauri-plugin-lifecycle = { git = "https://github.com/dash-chat/tauri-plugin-lifecycle", rev = "daf9678" }
tauri-plugin-network-interfaces = { git = "https://github.com/dash-chat/tauri-plugin-network-interfaces", rev = "9c50b47eab93202a55f0374fe9c70bb2016c8a2f" }

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
ndk-sys = "0.6"
# Logcat, as `tauri-plugin-log` writes it, for a process a push started.
android_logger = "0.15"
# Saves photos to the shared gallery (MediaStore).
tauri-plugin-android-fs = { version = "=28.4.0" }
# Enumerates recent gallery images (MediaStore) for the composer's recent-photos
# strip. JS bindings ship as `@universalappfactory/tauri-plugin-medialibrary`.
tauri-plugin-medialibrary = "=0.13"
tauri-plugin-background-service = "1.0"

[target.'cfg(target_os = "ios")'.dependencies]
oslog = "0.2"
# Fork: adds `limit`/`offset` (newest-first) to requestAlbumMedias and a
# `requestMediasByIds` fetch-by-id command, so the recent-photos strip and
# tap-to-send no longer render the entire album.
tauri-plugin-ios-photos = { git = "https://github.com/dash-chat/tauri-plugin-ios-photos", rev = "034dafd0a591fce73d4fe865e216cc3e225236c5" }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"

[target."cfg(not(any(target_os = \"android\", target_os = \"ios\")))".dependencies]
# 0.13 is what compiles against Tauri 2.12 on Windows, and it does not build for
# Android or iOS, where the bridge has never been used.
tauri-plugin-mcp-bridge = "0.13"
tauri-plugin-wdio-webdriver = { version = "1.4", optional = true }
tauri-plugin-autostart = "2"
tauri-plugin-keepawake = "0.1.0"
tauri-plugin-updater = "2.9"
mailbox-server = { path = "../crates/mailbox-server" }
mailbox-local-server = { workspace = true }
lan-multicast-probe = { workspace = true }

[features]
e2e-tests = [
  "dashchat-node/testing",
  "mailboxes-manager/e2e-test-ca",
  "dep:tauri-plugin-wdio-webdriver",
  "tauri-plugin-network-interfaces/wifi-control",
]

[dev-dependencies]
dashchat-node = { path = "../crates/dashchat-node", features = ["testing"] }
tokio = { version = "1", features = ["full"] }
tempfile = "3"
push-notifications-server = { path = "../crates/push-notifications-server", features = ["test-utils"] }
