[package]
name = "dash-chat"
version = "0.19.10"
description = "Dash Chat"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.70"

[lib]
name = "tauri_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
tauri-build = { version = "2.4.0", default-features = false, features = [] }
vergen-gitcl = "9"

[dependencies]
tauri = { version = "2.9", features = ["devtools", "tray-icon", "image-png"] }

tauri-plugin-mcp-bridge = "0.8"
tauri-plugin-dialog = "2.3"
tauri-plugin-process = "2.3"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-deep-link = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-sharekit = "0.3"
tauri-plugin-fs = "2"
tauri-plugin-os = "2"
tauri-plugin-log = { version = "2.0.0", features = ["tracing"] }

tauri-plugin-virtual-keyboard = { git = "https://github.com/dash-chat/tauri-plugin-virtual-keyboard", rev = "665a4049f8acd67b9cb251afe4e91a2323a115cc" }
tauri-plugin-mailto = { git = "https://github.com/dash-chat/tauri-plugin-mailto", branch = "main" }
tauri-plugin-notification = { git = "https://github.com/guillemcordoba/plugins-workspace", branch = "push-notifications", features = [
  "push-notifications-fcm",
] }

dashchat-node = { path = "../crates/dashchat-node" }
mailbox-client = { workspace = true }
push-notifications-client = { path = "../crates/push-notifications-client" }
dashchat-utils = { workspace = true }

p2panda = { workspace = true }
iroh = { workspace = true }
p2panda-auth = { workspace = true }
p2panda-core = { workspace = true }

anyhow = "1.0.95"
async-trait = "0.1.85"
time = "0.3"
tokio = { version = "1.43.0", features = ["fs"] }
tokio-util = { version = "0.7", features = ["rt"] }
thiserror = "2.0"
regex = "1"
hex = "0.4.3"
mdns-sd = "0.20"
nanoid = "0"
image = "0.25"

opener = { version = "0.7", features = ["reveal"] }
log = "0.4"
netdev = "0.43"
if-watch = { version = "3", features = ["tokio"] }
iana-time-zone = "0.1"
sysinfo = "0.38"
url2 = "0.0.6"
app_dirs2 = "2.5.5"
uuid = "1"
serde = "1"
serde_json = "1"
sqlx = { version = "0.8.6", features = ["sqlite", "runtime-tokio"] }
chrono = "0.4.42"
sonix-i18n = "0.1.1"
futures = "0.3"

# Work around "hyper-tls" not found issue in nix build tauri app
# TODO: remove this dependency
hyper-tls = "0.6"

# Logging
libc = "0.2"
env_logger = "0.11"

# Build openssl from source to cross-compile to each platform as needed
openssl-sys = { version = "0.9", features = ["vendored"] }

# `iroh-relay` (via `reqwest 0.13` + `rustls 0.23`) panics on first TLS
# handshake unless a CryptoProvider has been installed. Pull rustls in
# directly so we can install the `ring` provider at startup.
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }

[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-barcode-scanner = { git = "https://github.com/guillemcordoba/plugins-workspace", branch = "fix/barcode-scanner-ios" }
tauri-plugin-system-bars-styles = { git = "https://github.com/dash-chat/tauri-plugin-system-bars-styles", branch = "main" }
tauri-plugin-view = "0.0.5"

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
ndk-sys = "0.6"
ndk-context = "0.1"
# Saves photos to the shared gallery (MediaStore). 
tauri-plugin-android-fs = { version = "28.2" }
# Enumerates recent gallery images (MediaStore) for the composer's recent-photos
# strip. JS bindings ship as `@universalappfactory/tauri-plugin-medialibrary`.
tauri-plugin-medialibrary = "=0.13"

[target.'cfg(target_os = "ios")'.dependencies]
oslog = "0.2"
# Fork: adds `limit`/`offset` (newest-first) to requestAlbumMedias and a
# `requestMediasByIds` fetch-by-id command, so the recent-photos strip and
# tap-to-send no longer render the entire album.
tauri-plugin-ios-photos = { git = "https://github.com/dash-chat/tauri-plugin-ios-photos", rev = "ec723636ddf248dd6542e02fb2e83d91d1da36c9" }
# Releases SQLite locks on background so iOS can suspend the app without a
# 0xdead10cc kill; rebuilds the node on foreground.
tauri-plugin-ios-lifecycle = { git = "https://github.com/dash-chat/tauri-plugin-ios-lifecycle", branch = "main" }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"

[target."cfg(not(any(target_os = \"android\", target_os = \"ios\")))".dependencies]
tauri-plugin-autostart = "2"
tauri-plugin-keepawake = "0.1.0"
tauri-plugin-updater = "2.9"
mailbox-server = { path = "../crates/mailbox-server" }
mailbox-local-server = { workspace = true }

[features]
e2e-tests = ["dashchat-node/testing"]

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
tempfile = "3"
