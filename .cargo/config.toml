# audiopus_sys bundles an opus whose CMakeLists declares cmake_minimum_required 3.1,
# which CMake >= 4 refuses outright. Set here rather than in the CI environment:
# the iOS build runs cargo inside Xcode's script phase, which does not inherit
# the caller's environment, while cargo's [env] reaches every build script.
[env]
CMAKE_POLICY_VERSION_MINIMUM = "3.5"

# Debug builds overflow Windows' default 1 MB main-thread stack while the node
# starts up; Linux and macOS give the main thread 8 MB by default. This applies to
# every profile and binary on this target, not only debug builds.
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "link-arg=/STACK:8388608"]
