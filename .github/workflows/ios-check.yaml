name: "ios check"
on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  ios-check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use iOS rust toolchain
        run: cp rust-toolchain.ios.toml rust-toolchain.toml

      - name: Install Rust (with iOS targets)
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ''
          cache-shared-key: ios

      - name: cargo check
        env:
          IPHONEOS_DEPLOYMENT_TARGET: "14.0"
        run: cargo check -p dash-chat --target aarch64-apple-ios
