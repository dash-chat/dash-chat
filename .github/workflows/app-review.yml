name: App Review

on:
  pull_request:
    branches: [main]

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.33.0
          cache: true

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 20.12.2
          cache: 'pnpm'

      - name: Install Rust stable
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: '' # TODO: remove this when we want to disallow warnings in our rust code in CI

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            xvfb

      - name: Start virtual display
        run: |
          Xvfb :99 -screen 0 1920x1080x24 &
          echo "DISPLAY=:99" >> "$GITHUB_ENV"

      - name: Install and prepare
        run: |
          pnpm install
          pnpm -F ./packages/stores build
          npx @inlang/paraglide-js compile --project ./ui/project.inlang

      - name: Run app review
        id: review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Run the /review-app skill to perform a full app review.

            After the review is complete and you have the Phase 7 report, classify each issue into one of three severity levels:

            - **Major**: Functional breakage (broken interactions, navigation failures, missing data, crashes), blockers that prevent normal use of the app.
            - **Minor**: Significant visual issues (layout overflow that hides content, dark mode elements that are completely unreadable, RTL layout substantially broken, missing translations for key UI elements).
            - **Unimportant**: Cosmetic issues (minor alignment, small text truncation that doesn't hide meaning, subtle color inconsistencies, minor spacing differences).

            After writing the report, create a file called `review-verdict.txt` in the repository root:
            - First line must be exactly `PASS` or `FAIL`
            - `PASS` if there are NO major or minor issues (only unimportant ones or none at all)
            - `FAIL` if there are any major or minor issues
            - Remaining lines: a brief summary of any major/minor issues found

            You MUST always write this verdict file, even if the review encounters errors (write `FAIL` with an explanation).

          claude_args: "--model claude-opus-4-6 --allowed-tools Bash(gh api:*),Bash(gh issue view:*),Bash(gh search:*),Bash(gh issue list:*),Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr list:*),Bash(pnpm:*),mcp__tauri__driver_session,mcp__tauri__webview_find_element,mcp__tauri__read_logs,mcp__tauri__webview_interact,mcp__tauri__webview_screenshot,mcp__tauri__webview_keyboard,mcp__tauri__webview_wait_for,mcp__tauri__webview_get_styles,mcp__tauri__webview_execute_js,mcp__tauri__manage_window"

      - name: Check review verdict
        if: always()
        run: |
          if [ ! -f review-verdict.txt ]; then
            echo "::error::review-verdict.txt not found — review may have crashed"
            exit 1
          fi
          verdict=$(head -1 review-verdict.txt)
          echo "Verdict: $verdict"
          echo ""
          cat review-verdict.txt
          if [ "$verdict" != "PASS" ]; then
            echo ""
            echo "::error::App review found major or minor issues"
            exit 1
          fi
          echo ""
          echo "App review passed — no major or minor issues found"
