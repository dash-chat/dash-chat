name: "release"
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-staging'

jobs:
  create-release-draft:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    outputs:
      releaseId: ${{ steps.create.outputs.id }}
    steps:
      - uses: actions/checkout@v4

      - name: Read app version
        id: version
        run: echo "value=$(jq -r .version src-tauri/tauri.conf.json)" >> "$GITHUB_OUTPUT"

      - name: Create draft release
        id: create
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          prerelease: true
          name: Dash Chat v${{ steps.version.outputs.value }}${{ contains(github.ref_name, '-staging') && ' (staging)' || '' }}
          body: See the assets to download this version and install.

  release-tauri-app:
    needs: create-release-draft
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-26' # for Arm based macs (M1 and above).
            args: '--target aarch64-apple-darwin'
          - platform: 'macos-26' # for Intel based macs.
            args: '--target x86_64-apple-darwin'
          - platform: 'ubuntu-22.04' # for Tauri v1 you could replace this with ubuntu-20.04.
            args: ' -b appimage'
          - platform: 'windows-latest'
            args: ''
    env:
      MACOSX_DEPLOYMENT_TARGET: 10.13
    permissions: write-all

    runs-on: ${{ matrix.platform }}
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      # Checks out a copy of your repository on the ubuntu-latest machine
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.33.0
          cache: true

      - name: Install and prepare
        run: |
          pnpm install

      # Workaround for actions/runner-images#14097: on macos-15-arm64/20260511.0048+
      # /opt/homebrew/bin/{cargo,rustc,rustup,rustup-init} are broken rustup-init shims
      # that reject standard subcommands like `metadata`. We must delete them BEFORE
      # setup-rust-toolchain runs — otherwise the action sees `command -v rustup` succeed
      # against the broken shim, takes its "rustup already installed" branch, skips the
      # curl install of real proxies into ~/.cargo/bin/, and never adds ~/.cargo/bin to
      # GITHUB_PATH. Subsequent `cargo` invocations then fall through to the broken shim.
      - name: Remove broken homebrew rust shims (macOS)
        if: startsWith(matrix.platform, 'macos')
        run: rm -f /opt/homebrew/bin/cargo /opt/homebrew/bin/rustc /opt/homebrew/bin/rustup /opt/homebrew/bin/rustup-init

      # Icon Composer (.icon) sources require Xcode 26+'s actool to compile
      # into Assets.car; the default Xcode 16 emits only a partial-info.plist.
      - name: Select Xcode 26 (macOS)
        if: startsWith(matrix.platform, 'macos')
        run: |
          XCODE_APP=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [[ -z "$XCODE_APP" ]]; then
            echo "No Xcode 26.x found on runner" >&2
            ls /Applications | grep -i xcode >&2 || true
            exit 1
          fi
          echo "Selecting $XCODE_APP"
          sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          xcodebuild -version

      - name: install Rust stable
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: '' # TODO: remove this when we want to disallow warnings in our rust code in CI

      - name: install x86_64 target
        if: matrix.args == '--target x86_64-apple-darwin'
        run: rustup target add x86_64-apple-darwin

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.0-dev \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            javascriptcoregtk-4.1 \
            libsoup-3.0 \
            webkit2gtk-4.1

      - name: Set staging server URLs
        if: contains(github.ref_name, '-staging')
        run: |
          echo "MAILBOX_URL=https://mailbox.staging.darksoil.studio" >> $GITHUB_ENV
          echo "PUSH_NOTIFICATIONS_SERVER_URL=https://push-notifications.staging.darksoil.studio" >> $GITHUB_ENV

      - name: build the app
        uses: tauri-apps/tauri-action@v0
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Upload to the draft release created by the create-release-draft job.
          # When releaseId is set, tagName and releaseName are ignored.
          releaseId: ${{ needs.create-release-draft.outputs.releaseId }}
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
          args: ${{ matrix.args }}

  release-docker-images:
    if: ${{ !contains(github.ref_name, '-staging') }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        server: [mailbox-server, push-notifications-server]

    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install nix
        uses: cachix/install-nix-action@v27
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          nix_path: nixpkgs=channel:nixos-25.11

      - name: Log in to the github container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push docker image
        run: |
          script=$(nix build .#${{ matrix.server }}-docker --accept-flake-config --print-out-paths --no-link)
          "$script" | docker load
          version=$(jq -r .version src-tauri/tauri.conf.json)
          docker push ghcr.io/dash-chat/${{ matrix.server }}:$version

  release-tauri-android-app:
    needs: create-release-draft
    permissions: write-all

    runs-on: ubuntu-22.04
    steps:
      - name: Maximize build space
        uses: AdityaGarg8/remove-unwanted-software@v5
        with:
          remove-android: 'true'
          remove-dotnet: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'
          remove-large-packages: 'true'
          remove-cached-tools: 'true'

      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      # Checks out a copy of your repository on the ubuntu-latest machine
      - uses: actions/checkout@v4

      - name: Install nix
        uses: cachix/install-nix-action@v27
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          nix_path: nixpkgs=channel:nixos-25.11

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.33.0
          cache: true

      - uses: cachix/cachix-action@v15
        with:
          name: holochain-ci

      - uses: cachix/cachix-action@v15
        with:
          name: darksoil-studio

      - name: Load nix dev shell environment
        uses: nicknovitski/nix-develop@v1
        with:
          arguments: --accept-flake-config .#androidDev

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          shared-key: android-release

      - name: setup Android signing
        run: |
          cd src-tauri/gen/android
          echo "keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}" > key.properties
          echo "password=${{ secrets.ANDROID_KEY_PASSWORD }}" >> key.properties
          base64 -d <<< "${{ secrets.ANDROID_KEY_BASE64 }}" > $RUNNER_TEMP/keystore.jks
          echo "storeFile=$RUNNER_TEMP/keystore.jks" >> key.properties

      - name: setup google-services.json
        run: |
          cd src-tauri/gen/android
          echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > google-services.json

      - name: Generate tauri.properties (Workaround for Tauri 2.9.x bug)
        run: |
          # Workaround for Tauri 2.9.x not generating tauri.properties correctly
          # See: https://github.com/tauri-apps/tauri/issues/14413
          VERSION=$(jq -r '.version' src-tauri/tauri.conf.json)
          VERSION_CODE=$(jq -r '.bundle.android.versionCode // empty' src-tauri/tauri.conf.json)

          if [ -z "$VERSION_CODE" ]; then
            # Compute versionCode from version (major*1000000 + minor*1000 + patch)
            IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
            VERSION_CODE=$(( MAJOR * 1000000 + MINOR * 1000 + PATCH ))
          fi

          mkdir -p src-tauri/gen/android/app
          cat > src-tauri/gen/android/app/tauri.properties << EOF
          // THIS IS AN AUTOGENERATED FILE. DO NOT EDIT THIS FILE DIRECTLY.
          tauri.android.versionName=$VERSION
          tauri.android.versionCode=$VERSION_CODE
          EOF

          echo "Generated tauri.properties with version $VERSION and versionCode $VERSION_CODE"

      - name: Set staging server URLs
        if: contains(github.ref_name, '-staging')
        run: |
          echo "MAILBOX_URL=https://mailbox.staging.darksoil.studio" >> $GITHUB_ENV
          echo "PUSH_NOTIFICATIONS_SERVER_URL=https://push-notifications.staging.darksoil.studio" >> $GITHUB_ENV

      - name: Install and Build 🔧
        run: pnpm install && pnpm tauri android build --aab --apk

      - name: Upload AAB to release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: src-tauri/gen/android/app/build/outputs/bundle/universalRelease/app-universal-release.aab
          release_id: ${{ needs.create-release-draft.outputs.releaseId }}
          draft: true

      - name: Upload APK to release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release.apk
          release_id: ${{ needs.create-release-draft.outputs.releaseId }}
          draft: true
