name: Backwards Compatibility

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  compat:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        version: [HEAD]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history to check out old tags
          fetch-tags: true

      - name: Fetch all tags
        run: git fetch --tags --force

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            webkit2gtk-driver \
            xvfb

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.33.0
          cache: true

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ''

      - name: Install tauri-driver
        run: cargo install tauri-driver --locked

      - name: Run backwards compatibility test (${{ matrix.version }})
        run: bash e2e-tests/compat/run.sh "${{ matrix.version }}"

      - name: Cleanup
        if: always()
        run: rm -rf .dbs/compat .e2e-binaries
