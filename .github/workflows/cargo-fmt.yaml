name: "cargo fmt"
on:
  push:
    branches: [ main, 'main-**', develop ]
  pull_request:
    branches: [ main, 'main-**', develop ]

jobs:
  cargo-fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt
          rustflags: ''

      - name: Check Rust formatting
        run: cargo fmt --check
