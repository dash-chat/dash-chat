name: E2E Tests

on:
  push:
    branches: [main, 'main-**', develop]
  pull_request:
    branches: [main, 'main-**', develop]

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            webkit2gtk-driver \
            xvfb

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          cache: true

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ''

      - name: Cache Rust target
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Install tauri-driver
        run: cargo install tauri-driver --locked

      - name: Install pnpm dependencies
        run: pnpm install --reporter=append-only

      - name: Build UI packages
        run: pnpm -F ./packages/stores build

      # dbus-run-session gives the apps a working session bus. Without it,
      # GLib falls back to the runner's systemd user bus, where activating
      # org.freedesktop.portal.Desktop hangs (headless), stalling every app
      # launch ~30s before window creation plus ~5s in the theme query.
      - name: Run E2E tests
        run: set -o pipefail && dbus-run-session -- xvfb-run pnpm test 2>&1 | tee e2e-output.log
        working-directory: e2e-tests

      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-logs
          path: |
            e2e-tests/e2e-output.log
            .dbs/e2e/failures/
          # .dbs is a dotted directory, which upload-artifact skips by default,
          # so the failure screenshots never reached the artifact.
          include-hidden-files: true
          retention-days: 7

      - name: Cleanup E2E data
        if: always()
        run: rm -rf .dbs/e2e
