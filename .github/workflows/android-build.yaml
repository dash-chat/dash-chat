name: "android build"
on:
  push:
    branches: [ main, 'main-**', develop ]
  pull_request:
    branches: [ main, 'main-**', develop ]

jobs:
  android-build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install nix
        uses: cachix/install-nix-action@v27
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          nix_path: nixpkgs=channel:nixos-25.11

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          cache: true

      - uses: cachix/cachix-action@v15
        with:
          name: holochain-ci

      - uses: cachix/cachix-action@v15
        with:
          name: darksoil-studio

      - uses: cachix/cachix-action@v15
        with:
          name: dash-chat
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Load nix dev shell environment
        uses: nicknovitski/nix-develop@v1
        with:
          arguments: --accept-flake-config .#androidDev

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          shared-key: android

      # audiopus_sys configures its vendored libopus in a build dir the cache
      # restores. When the NDK's nix store path differs from the cached
      # CMAKE_C_COMPILER, CMake deletes its cache and re-runs configure
      # internally — and that re-run drops CMAKE_POLICY_VERSION_MINIMUM, so
      # opus' `cmake_minimum_required(VERSION 3.1)` becomes a hard error under
      # CMake 4. Neither the env var nor a -D flag survives it; only a fresh
      # build dir does.
      - name: Drop cached audiopus_sys CMake build dirs
        run: rm -rf target/*/*/build/audiopus_sys-*

      - name: Install and build (debug, no bundle)
        run: pnpm install --reporter=append-only && pnpm tauri android build --debug --apk --target aarch64
