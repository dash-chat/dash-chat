name: "ui build"
on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  ui-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.33.0
          cache: true

      - name: Install pnpm dependencies
        run: pnpm install

      - name: Build UI packages
        run: pnpm --recursive build

      - name: Check Svelte types and formatting
        run: pnpm -F ui check
