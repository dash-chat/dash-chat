[profile.release]
opt-level = 3
# Why not "abort": see crates/panic-policy/src/lib.rs.
panic = "unwind"
lto = "fat"
codegen-units = 1
# inherits = "release"

[workspace]
members = ["crates/*", "src-tauri"]
resolver = "2"

[workspace.dependencies]

aliased = "0.1.0"
anyhow = "1"
async-trait = "0.1"
bytes = "1.11"
ciborium = "0.2.2"
ed25519-dalek = "2.2"
derive_more = { version = "2.1.1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"

dashchat-compat = { path = "crates/dashchat-compat" }
dashchat-utils = { path = "crates/dashchat-utils" }
panic-policy = { path = "crates/panic-policy" }
network-watch = { path = "crates/network-watch" }
mailbox-client = { path = "crates/mailbox-client" }
opus-transcode = { path = "crates/opus-transcode" }
tauri-plugin-sentry-reporting = { path = "crates/tauri-plugin-sentry-reporting" }
mailbox-server = { path = "crates/mailbox-server" }
mailbox-local-server = { path = "crates/mailbox-local-server" }
local-hub-discovery = { path = "crates/local-hub-discovery" }
reporting = { path = "crates/reporting" }

# p2panda 0.7.1 with the offline-node backport and the groups extension API,
# merged with `dashchat-named-stream-cursors`, which adds:
# - SQLite transactions begin with BEGIN IMMEDIATE, so the app and the iOS push
#   extension sharing one database file stop refusing each other's writes with
#   "database is locked".
# - The `custom_cursor_name` param to `stream_from` (p2panda#1408).
p2panda = { git = "https://github.com/dash-chat/p2panda", rev = "9bf66a5ec69ea78c" }
p2panda-auth = { git = "https://github.com/dash-chat/p2panda", rev = "9bf66a5ec69ea78c", features = [
  "serde",
] }
p2panda-core = { git = "https://github.com/dash-chat/p2panda", rev = "9bf66a5ec69ea78c" }
p2panda-net = { git = "https://github.com/dash-chat/p2panda", rev = "9bf66a5ec69ea78c" }
p2panda-store = { git = "https://github.com/dash-chat/p2panda", rev = "9bf66a5ec69ea78c", features = [
  "sqlite",
] }
# Do NOT enable `test_utils` here: it chains through p2panda-auth to
# p2panda-core, whose `test_utils` swaps `Timestamp::now()` for a frozen
# mock_instant clock — in normal builds, not just tests. Every operation then
# carries the same timestamp and timestamp-ordered validation (replies, edits,
# deletes) collapses.
p2panda-spaces = { git = "https://github.com/dash-chat/p2panda", rev = "9bf66a5ec69ea78c" }
p2panda-encryption = { git = "https://github.com/dash-chat/p2panda", rev = "9bf66a5ec69ea78c" }
p2panda-stream = { git = "https://github.com/dash-chat/p2panda", rev = "9bf66a5ec69ea78c" }

# iroh imports must match p2panda iroh dep version
iroh = { version = "1.0.0", default-features = false, features = [
  "tls-ring",
] }
iroh-blobs = "0.103.0"

[patch.crates-io]
iroh-blobs = { git = "https://github.com/maackle/iroh-blobs", branch = "main" }
# Fork of iroh main (1.2.0 + PR #4512, the relay-backpressure fix) carrying the
# iroh#4390 pending_open_paths fix (dash-chat/iroh branch dashchat)
iroh = { git = "https://github.com/dash-chat/iroh", rev = "4e42c9350414609594a60de95a51f3fe933ee018" }
iroh-base = { git = "https://github.com/dash-chat/iroh", rev = "4e42c9350414609594a60de95a51f3fe933ee018" }
iroh-dns = { git = "https://github.com/dash-chat/iroh", rev = "4e42c9350414609594a60de95a51f3fe933ee018" }
iroh-relay = { git = "https://github.com/dash-chat/iroh", rev = "4e42c9350414609594a60de95a51f3fe933ee018" }
# iroh-gossip 0.101.0 + n0-computer/iroh-gossip PRs #161, #162 and #163 (resource
# cleanup, failed-dial and lost-join recovery, rejoin when isolated)
iroh-gossip = { git = "https://github.com/dash-chat/iroh-gossip", rev = "efc565e0e63800a77a3add0dbb97f980278e2974" }
# tauri-plugin-background-service depends on tauri-plugin-notification from
# crates-io; redirect it to the fork rev so it doesn't clash with our direct
# fork dep on the `links = "tauri-plugin-notification"` native-library key.
tauri-plugin-notification = { git = "https://github.com/guillemcordoba/plugins-workspace", rev = "3136b282944beea5bc2bc7ef184c84d25b594616" }
# swarm-discovery 0.6.3 + a non-fatal default-interface multicast join, so a
# hub on a host without a default route (an offline hotspot) can still start
swarm-discovery = { git = "https://github.com/dash-chat/swarm-discovery", rev = "1cf4c14c67b60bf8c020b5cc002fd7f438492199" }

[patch."https://github.com/dash-chat/p2panda"]
p2panda = { path = "/home/michael/work/p2panda/p2panda" }
p2panda-auth = { path = "/home/michael/work/p2panda/p2panda-auth" }
p2panda-core = { path = "/home/michael/work/p2panda/p2panda-core" }
p2panda-store = { path = "/home/michael/work/p2panda/p2panda-store" }
p2panda-spaces = { path = "/home/michael/work/p2panda/p2panda-spaces" }
p2panda-net = { path = "/home/michael/work/p2panda/p2panda-net" }
p2panda-stream = { path = "/home/michael/work/p2panda/p2panda-stream" }
p2panda-sync = { path = "/home/michael/work/p2panda/p2panda-sync" }
p2panda-discovery = { path = "/home/michael/work/p2panda/p2panda-discovery" }
p2panda-encryption = { path = "/home/michael/work/p2panda/p2panda-encryption" }
