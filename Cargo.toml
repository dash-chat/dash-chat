[profile.release]
opt-level = 3
panic = "abort"
lto = "fat"
codegen-units = 1
# inherits = "release"

[workspace]
members = ["crates/*", "src-tauri"]
resolver = "2"

[workspace.dependencies]

aliased = "0.1.0"
anyhow = "1"
async-trait = "0.1"
ciborium = "0.2.2"
ed25519-dalek = "2.2"
derive_more = { version = "2.1.1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"

dashchat-compat = { path = "crates/dashchat-compat" }
dashchat-utils = { path = "crates/dashchat-utils" }
mailbox-client = { path = "crates/mailbox-client" }
mailbox-server = { path = "crates/mailbox-server" }
mailbox-local-server = { path = "crates/mailbox-local-server" }
mailbox-mdns-discovery = { path = "crates/mailbox-mdns-discovery" }
replicating-local-mailbox-server = { path = "crates/replicating-local-mailbox-server" }

p2panda = { git = "https://github.com/dash-chat/p2panda", branch = "dashchat" }
p2panda-auth = { git = "https://github.com/dash-chat/p2panda", branch = "dashchat", features = [
  "processor",
] }
p2panda-core = { git = "https://github.com/dash-chat/p2panda", branch = "dashchat" }
p2panda-net = { git = "https://github.com/dash-chat/p2panda", branch = "dashchat" }
p2panda-store = { git = "https://github.com/dash-chat/p2panda", branch = "dashchat", features = [
  "sqlite",
] }
p2panda-spaces = { git = "https://github.com/dash-chat/p2panda", branch = "dashchat", features = [
  "test_utils",
] }

# iroh imports must match p2panda iroh dep version
iroh = { version = "1.0.0", default-features = false, features = [
  "tls-ring",
] }
iroh-blobs = "0.103.0"

[patch.crates-io]
iroh-blobs = { git = "https://github.com/maackle/iroh-blobs", branch = "main" }

# Fork of p2panda (rev 92e7782 + one patch): clears the SQLite TransactionPermit
# slot synchronously on drop (p2panda-store/src/sqlite.rs) so a cancelled rollback
# task can't poison the store and abort the process. See the iOS push-extension /
# shared-DB crash investigation.
