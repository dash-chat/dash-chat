[profile.release]
opt-level = 3
panic = "abort"
lto = "fat"
codegen-units = 1
# inherits = "release"

[workspace]
members = ["crates/*", "src-tauri"]
resolver = "2"

[workspace.dependencies]

aliased = "0.1.0"
anyhow = "1"
async-trait = "0.1"
bytes = "1.11"
ciborium = "0.2.2"
ed25519-dalek = "2.2"
derive_more = { version = "2.1.1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"

dashchat-compat = { path = "crates/dashchat-compat" }
dashchat-utils = { path = "crates/dashchat-utils" }
network-watch = { path = "crates/network-watch" }
mailbox-client = { path = "crates/mailbox-client" }
opus-transcode = { path = "crates/opus-transcode" }
tauri-plugin-sentry-reporting = { path = "crates/tauri-plugin-sentry-reporting" }
mailbox-server = { path = "crates/mailbox-server" }
mailbox-local-server = { path = "crates/mailbox-local-server" }
local-hub-discovery = { path = "crates/local-hub-discovery" }
reporting = { path = "crates/reporting" }

# `dashchat-offline-node` plus one commit: SQLite transactions begin with
# BEGIN IMMEDIATE, so the app and the iOS push extension sharing one database
# file stop refusing each other's writes with "database is locked".
p2panda = { git = "https://github.com/dash-chat/p2panda", branch = "dashchat-named-stream-cursors" }
p2panda-auth = { git = "https://github.com/dash-chat/p2panda", branch = "dashchat-named-stream-cursors", features = [
  "processor",
] }
p2panda-core = { git = "https://github.com/dash-chat/p2panda", branch = "dashchat-named-stream-cursors" }
p2panda-net = { git = "https://github.com/dash-chat/p2panda", branch = "dashchat-named-stream-cursors" }
p2panda-store = { git = "https://github.com/dash-chat/p2panda", branch = "dashchat-named-stream-cursors", features = [
  "sqlite",
] }
p2panda-spaces = { git = "https://github.com/dash-chat/p2panda", branch = "dashchat-named-stream-cursors", features = [
  "test_utils",
] }

# iroh imports must match p2panda iroh dep version
iroh = { version = "1.0.0", default-features = false, features = [
  "tls-ring",
] }
iroh-blobs = "0.103.0"

[patch.crates-io]
iroh-blobs = { git = "https://github.com/maackle/iroh-blobs", branch = "main" }
# Fork of iroh main (1.2.0 + PR #4512, the relay-backpressure fix) carrying the
# iroh#4390 pending_open_paths fix (dash-chat/iroh branch dashchat)
iroh = { git = "https://github.com/dash-chat/iroh", rev = "4e42c9350414609594a60de95a51f3fe933ee018" }
iroh-base = { git = "https://github.com/dash-chat/iroh", rev = "4e42c9350414609594a60de95a51f3fe933ee018" }
iroh-dns = { git = "https://github.com/dash-chat/iroh", rev = "4e42c9350414609594a60de95a51f3fe933ee018" }
iroh-relay = { git = "https://github.com/dash-chat/iroh", rev = "4e42c9350414609594a60de95a51f3fe933ee018" }
# iroh-gossip 0.101.0 + n0-computer/iroh-gossip PR #159 (redial after a failed dial)
iroh-gossip = { git = "https://github.com/YuniqueUnic/iroh-gossip", rev = "9eb21c0b99fab5cfca9876e949b05d2aa1fae850" }
# tauri-plugin-background-service depends on tauri-plugin-notification from
# crates-io; redirect it to the fork rev so it doesn't clash with our direct
# fork dep on the `links = "tauri-plugin-notification"` native-library key.
tauri-plugin-notification = { git = "https://github.com/guillemcordoba/plugins-workspace", rev = "29867d696371de6cc315fbb0db9820e288b4124c" }

# Fork of p2panda (rev 92e7782 + one patch): clears the SQLite TransactionPermit
# slot synchronously on drop (p2panda-store/src/sqlite.rs) so a cancelled rollback
# task can't poison the store and abort the process. See the iOS push-extension /
# shared-DB crash investigation.
