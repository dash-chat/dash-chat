[profile.release]
opt-level = 3
# Why not "abort": see crates/panic-policy/src/lib.rs.
panic = "unwind"
lto = "fat"
codegen-units = 1
# inherits = "release"

[workspace]
members = ["crates/*", "src-tauri"]
resolver = "2"

[workspace.dependencies]

aliased = "0.1.0"
anyhow = "1"
async-trait = "0.1"
bytes = "1.11"
ciborium = "0.2.2"
ed25519-dalek = "2.2"
derive_more = { version = "2.1.1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2.0"
tracing = "0.1"

dashchat-compat = { path = "crates/dashchat-compat" }
dashchat-utils = { path = "crates/dashchat-utils" }
sqlite-gate = { path = "crates/sqlite-gate" }
panic-policy = { path = "crates/panic-policy" }
network-watch = { path = "crates/network-watch" }
mailbox-client = { path = "crates/mailbox-client" }
mailboxes-manager = { path = "crates/mailboxes-manager" }
opus-transcode = { path = "crates/opus-transcode" }
tauri-plugin-sentry-reporting = { path = "crates/tauri-plugin-sentry-reporting" }
mailbox-server = { path = "crates/mailbox-server" }
mailbox-local-server = { path = "crates/mailbox-local-server" }
local-hub-discovery = { path = "crates/local-hub-discovery" }
lan-multicast-probe = { path = "crates/lan-multicast-probe" }
reporting = { path = "crates/reporting" }

# p2panda 0.7.1 with the offline-node backport and the groups extension API,
# merged with `dashchat-named-stream-cursors`, which adds:
# - SQLite transactions begin with BEGIN IMMEDIATE, so the app and the iOS push
#   extension sharing one database file stop refusing each other's writes with
#   "database is locked".
# - The `custom_cursor_name` param to `stream_from` (p2panda#1408).
# On top, the `dashchat-071-lan-priority` sync patches: nodes found over mDNS
# are discovered right away, and sync forgets ended sessions, skips duplicate
# ones and backs off from nodes whose sessions keep failing. It also moves
# p2panda-net to iroh-gossip 0.102.
p2panda = { git = "https://github.com/dash-chat/p2panda", rev = "630d1c5e3f618f9ae24211d24ca7b1707636ff05" }
p2panda-auth = { git = "https://github.com/dash-chat/p2panda", rev = "630d1c5e3f618f9ae24211d24ca7b1707636ff05", features = [
  "serde",
] }
p2panda-core = { git = "https://github.com/dash-chat/p2panda", rev = "630d1c5e3f618f9ae24211d24ca7b1707636ff05" }
p2panda-net = { git = "https://github.com/dash-chat/p2panda", rev = "630d1c5e3f618f9ae24211d24ca7b1707636ff05" }
p2panda-store = { git = "https://github.com/dash-chat/p2panda", rev = "630d1c5e3f618f9ae24211d24ca7b1707636ff05", features = [
  "sqlite",
] }
# Do NOT enable `test_utils` here: it chains through p2panda-auth to
# p2panda-core, whose `test_utils` swaps `Timestamp::now()` for a frozen
# mock_instant clock — in normal builds, not just tests. Every operation then
# carries the same timestamp and timestamp-ordered validation (replies, edits,
# deletes) collapses.
p2panda-spaces = { git = "https://github.com/dash-chat/p2panda", rev = "630d1c5e3f618f9ae24211d24ca7b1707636ff05" }
p2panda-encryption = { git = "https://github.com/dash-chat/p2panda", rev = "630d1c5e3f618f9ae24211d24ca7b1707636ff05" }
p2panda-stream = { git = "https://github.com/dash-chat/p2panda", rev = "630d1c5e3f618f9ae24211d24ca7b1707636ff05" }

# iroh imports must match p2panda iroh dep version
iroh = { version = "1.4.1", default-features = false, features = [
  "tls-ring",
] }
iroh-blobs = "0.104.0"

[patch.crates-io]
# tao 0.37.1 + tauri-apps/tao#1376: forwards the URL that cold-launches the iOS
# app, which tao drops on the scene lifecycle (dash-chat/tao branch dashchat)
tao = { git = "https://github.com/dash-chat/tao", rev = "69ae7dba9271dc05e5746e2e7fff8997bd5c77b9" }
# tauri-plugin-background-service depends on tauri-plugin-notification from
# crates-io; redirect it to the fork rev so it doesn't clash with our direct
# fork dep on the `links = "tauri-plugin-notification"` native-library key.
tauri-plugin-notification = { git = "https://github.com/guillemcordoba/plugins-workspace", rev = "aba9d7a971294c0eae6a271a8c6d0d7493c65df0" }
# ndk-context 0.1.1 + rust-mobile/ndk-context PRs #6 and #8 (RwLock-held context,
# try_* functions) + a second initialize_android_context keeping the first context
# instead of panicking (dash-chat/ndk-context branch dashchat). android_init.rs
# installs the context from JNI_OnLoad and tao 0.37 installs it again when the
# activity is created.
ndk-context = { git = "https://github.com/dash-chat/ndk-context", rev = "4ed51f9e864f4b380fb4a495637543a785a9d115" }

# Fork of p2panda (rev 92e7782 + one patch): clears the SQLite TransactionPermit
# slot synchronously on drop (p2panda-store/src/sqlite.rs) so a cancelled rollback
# task can't poison the store and abort the process. See the iOS push-extension /
# shared-DB crash investigation.
