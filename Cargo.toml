[profile.release]
opt-level = 3
panic = "abort"
lto = "fat"
codegen-units = 1
# inherits = "release"

[workspace]
members = ["crates/*", "src-tauri"]
resolver = "2"

[workspace.dependencies]

ciborium = "0.2.2"
ed25519-dalek = "2.2"
derive_more = { version = "2.1.1", features = ["full"] }
named-id = { git = "https://github.com/maackle/named-id.git" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

dashchat-compat = { path = "crates/dashchat-compat" }
mailbox-client = { path = "crates/mailbox-client", features = ["named-id"] }
mailbox-server = { path = "crates/mailbox-server" }

p2panda = { git = "https://github.com/p2panda/p2panda", rev = "82aeec0def947755bf00aa3a4c305cc991bc6dfe" }
p2panda-auth = { git = "https://github.com/p2panda/p2panda", rev = "82aeec0def947755bf00aa3a4c305cc991bc6dfe", features = [
  "processor",
] }
p2panda-core = { git = "https://github.com/p2panda/p2panda", rev = "82aeec0def947755bf00aa3a4c305cc991bc6dfe" }
p2panda-encryption = { git = "https://github.com/p2panda/p2panda", rev = "82aeec0def947755bf00aa3a4c305cc991bc6dfe" }
p2panda-discovery = { git = "https://github.com/p2panda/p2panda", rev = "82aeec0def947755bf00aa3a4c305cc991bc6dfe" }
p2panda-net = { git = "https://github.com/p2panda/p2panda", rev = "82aeec0def947755bf00aa3a4c305cc991bc6dfe" }
p2panda-store = { git = "https://github.com/p2panda/p2panda", rev = "82aeec0def947755bf00aa3a4c305cc991bc6dfe", features = [
  "sqlite",
] }
p2panda-stream = { git = "https://github.com/p2panda/p2panda", rev = "82aeec0def947755bf00aa3a4c305cc991bc6dfe" }
p2panda-sync = { git = "https://github.com/p2panda/p2panda", rev = "82aeec0def947755bf00aa3a4c305cc991bc6dfe" }
p2panda-spaces = { git = "https://github.com/p2panda/p2panda", rev = "82aeec0def947755bf00aa3a4c305cc991bc6dfe", features = [
  "test_utils",
] }
