packages:
  - ui
  - packages/*
  - e2e-tests

# Verify node_modules against the lockfile before `pnpm run`/`pnpm exec` and
# auto-install only when it is stale, so `just dev` installs new deps yet skips
# the install when everything is already up to date.
verifyDepsBeforeRun: install

allowBuilds:
  edgedriver: true
  esbuild: true
  geckodriver: true
  # Builds dist-js via its `prepare` script when installed from the git fork.
  "@gbyte/tauri-plugin-ios-photos@https://codeload.github.com/dash-chat/tauri-plugin-ios-photos/tar.gz/ec723636ddf248dd6542e02fb2e83d91d1da36c9": true
  tauri-plugin-system-theme: true
  tauri-plugin-virtual-keyboard@https://codeload.github.com/dash-chat/tauri-plugin-virtual-keyboard/tar.gz/a20b82e5091fa9834b1ea1014fc336ebfe7c4547: true
  appium: true
  sharp: true

patchedDependencies:
  konsta@5.0.6: patches/konsta@5.0.6.patch
  signalium@3.0.1: patches/signalium@3.0.1.patch
