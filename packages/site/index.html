		<script type="module">
			const ANDROID_STORE_URL =
				'https://play.google.com/store/apps/details?id=studio.darksoil.dashchat&pcampaignid=web_share';
			const IOS_STORE_URL =
				'https://apps.apple.com/app/dash-chat-messenger/id6759798505';

			function redirectToAppStoreIfMobile() {
				const ua = navigator.userAgent;

				if (/android/i.test(ua)) {
					window.location.replace(ANDROID_STORE_URL);
					// iPadOS spoofs a macOS user agent, but reports maxTouchPoints > 1 (real Macs report 0)
				} else if (
					/iPad|iPhone|iPod/.test(ua) ||
					('maxTouchPoints' in navigator &&
						navigator.maxTouchPoints > 1 &&
						/Macintosh/.test(ua))
				) {
					window.location.replace(IOS_STORE_URL);
				}
			}
			redirectToAppStoreIfMobile();
		</script>
		<script type="module">
			import './src/download-installer-button.ts';
		</script>
		<script type="module">
			import '@shoelace-style/shoelace/dist/themes/dark.css';
			import '@shoelace-style/shoelace/dist/themes/light.css';

			// Apply correct Shoelace theme based on system preference
			function applyTheme() {
				const isDark = window.matchMedia(
					'(prefers-color-scheme: dark)',
				).matches;
				document.documentElement.classList.toggle('sl-theme-dark', isDark);
				document.documentElement.classList.toggle('sl-theme-light', !isDark);
			}
			applyTheme();
			window
				.matchMedia('(prefers-color-scheme: dark)')
				.addEventListener('change', applyTheme);
		</script>
